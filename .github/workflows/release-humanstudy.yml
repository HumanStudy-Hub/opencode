name: release-humanstudy
run-name: "opencode-humanstudy ${{ github.ref_name }}"

# Push a tag `hs-v<upstream-version>[-<revision>]` (e.g. hs-v1.18.21 or hs-v1.18.21-2) to
# build the desktop-app binaries and publish them as a GitHub release.
# Manual runs (workflow_dispatch) build and upload workflow artifacts only; no release is made.
on:
  push:
    tags:
      - "hs-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to embed for a manual test build (default: package-derived 1.18.21)"
        required: false
        type: string

permissions:
  contents: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    # Like upstream's build-cli job: one Linux runner cross-compiles every Bun target.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - id: version
        name: Derive version from tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#hs-v}"   # 1.18.21 or 1.18.21-2
            v="${v%%-*}"                   # drop the HumanStudy revision suffix: the binary reports the upstream semver
          else
            v="${INPUT_VERSION:-1.18.21}"
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - uses: ./.github/actions/setup-bun

      - name: Build all targets
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: latest

      - name: Package zips and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # upstream target dir -> HumanStudy asset name
          for t in darwin-arm64 darwin-x64 darwin-x64-baseline windows-x64 windows-x64-baseline windows-arm64; do
            src="packages/opencode/dist/opencode-${t}/bin"
            test -d "$src" || { echo "missing build output: $src"; exit 1; }
            (cd "$src" && zip -qr "$GITHUB_WORKSPACE/release/opencode-humanstudy-${t}.zip" .)
          done
          cd release
          sha256sum opencode-humanstudy-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-humanstudy
          path: release/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-humanstudy
          path: release

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "opencode-humanstudy ${GITHUB_REF_NAME#hs-v}" \
            --notes "HumanStudy edition of opencode ${VERSION} (upstream v${VERSION} plus the patches in HUMANSTUDY.md). Verify downloads against SHA256SUMS.txt."
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
